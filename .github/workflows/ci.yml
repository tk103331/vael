name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  experiments:
    name: Test the plugin experiments
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/plugins
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: experiments/plugins/go.mod
          cache: true
          cache-dependency-path: experiments/plugins/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build the binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the editor and the core for every target
        run: |
          mkdir -p build
          go build -trimpath -o build/vael-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o build/vael-windows-amd64.exe .
          go build -trimpath -o build/vael-core-linux-amd64 ./cmd/vael-core
          GOOS=linux GOARCH=arm64 go build -trimpath -o build/vael-core-linux-arm64 ./cmd/vael-core
          GOOS=windows GOARCH=amd64 go build -trimpath -o build/vael-core-windows-amd64.exe ./cmd/vael-core
      - uses: actions/upload-artifact@v7
        with:
          name: vael-binaries
          path: build/
          if-no-files-found: error