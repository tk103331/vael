name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p build out
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            name="vael-$goos-$goarch"
            dir="build/$name"
            mkdir -p "$dir"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            GOOS=$goos GOARCH=$goarch go build -trimpath -o "$dir/vael$ext" .
            GOOS=$goos GOARCH=$goarch go build -trimpath -o "$dir/vael-core$ext" ./cmd/vael-core
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../out/$name.zip" "$name")
            else
              chmod +x "$dir/vael" "$dir/vael-core"
              tar -czf "out/$name.tar.gz" -C build "$name"
            fi
          done
          (cd out && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* \
              --verify-tag \
              --title "Vael ${tag#v}" \
              --generate-notes
          fi